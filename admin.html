<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reid's Parties - Admin</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#fbf4c7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fbf4c7'/%3E%3Ctext x='32' y='46' font-family='Georgia,serif' font-size='40' font-weight='700' fill='%23e4726a' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://use.typekit.net/yvb0zhe.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&family=Fraunces:opsz,wght@9..144,400..900&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{
  --bg:#fbf4c7;
  --card:#fffdf4;
  --line:#efd9a6;
  --ink:#6b4f47;
  --rose:#e79b93;
  --coral:#e4726a;
  --coral-bright:#f0736b;
  --btn:#f7cbc6;
  --ok:#5c8a4e;
  --warn:#a8791c;
  --bad:#c0504d;
  --fdisp:"quiche-display","Fraunces",Georgia,serif;
  --fsans:"quiche-sans","Figtree",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--fsans);min-height:100dvh;
}
::selection{background:var(--coral);color:var(--bg)}
.wrap{max-width:860px;margin:0 auto;padding:28px 18px 80px}

.card,.panel{
  background:var(--card);border:2px solid var(--line);border-radius:18px;
  box-shadow:0 6px 18px rgba(228,114,106,.08);
}
.btn{
  appearance:none;background:var(--btn);border:none;color:var(--coral);
  border-radius:999px;padding:12px 20px;
  font-family:var(--fsans);font-weight:700;font-size:14px;line-height:1;
  cursor:pointer;box-shadow:0 4px 12px rgba(228,114,106,.14);
  transition:box-shadow .15s ease, transform .15s ease;touch-action:manipulation;
}
.btn:hover{box-shadow:0 7px 16px rgba(228,114,106,.22);transform:translateY(-1px)}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--coral);box-shadow:none}
.btn.ghost:hover{border-color:var(--coral-bright)}

.logo{
  font-family:var(--fdisp);font-weight:700;
  font-size:clamp(30px,7vw,44px);line-height:1;color:var(--coral);
}
.sub{font-weight:700;font-size:12px;letter-spacing:.3em;color:var(--rose);text-transform:uppercase;margin-top:8px}
.topRow{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:22px}
.topBtns{display:flex;gap:10px}

/* lock screen */
#lock{max-width:430px;margin:18vh auto 0;padding:34px 28px;display:none;flex-direction:column;gap:18px}
#lock.on{display:flex}
.inp{
  width:100%;background:#fff;border:2px solid var(--line);border-radius:12px;color:var(--ink);
  font-family:var(--fsans);font-weight:500;font-size:18px;padding:14px;outline:none;
  transition:border-color .15s, box-shadow .15s;
}
.inp:focus{border-color:var(--coral-bright);box-shadow:0 0 0 4px rgba(240,115,107,.14)}
.err{font-weight:600;font-size:14px;color:var(--bad);min-height:18px}

/* dashboard */
#dash{display:none}
#dash.on{display:block}
.statRow{display:flex;align-items:baseline;gap:14px;margin-bottom:18px}
.statNum{font-family:var(--fdisp);font-weight:700;font-size:46px;line-height:1;color:var(--coral)}
.statLbl{font-weight:700;font-size:12px;letter-spacing:.3em;color:var(--rose);text-transform:uppercase}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{
  appearance:none;background:transparent;border:2px solid var(--line);color:var(--rose);border-radius:999px;
  padding:9px 14px;font-family:var(--fsans);font-weight:700;font-size:12px;line-height:1;
  letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:.15s;
}
.tab.on{background:var(--btn);border-color:var(--btn);color:var(--coral)}
#search{margin-bottom:22px}

.card{padding:20px;margin-bottom:18px}
.cardHead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cnum{font-family:var(--fdisp);font-weight:700;font-size:22px;color:var(--rose)}
.cname{font-family:var(--fdisp);font-weight:700;font-size:24px;color:var(--coral)}
.cage{font-weight:700;font-size:12px;letter-spacing:.08em;color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:5px 10px}
.cardHead .grow{flex:1}
select.status{
  appearance:none;background:#fff;border:2px solid var(--line);color:var(--ink);border-radius:999px;
  padding:9px 14px;font-family:var(--fsans);font-weight:700;font-size:12px;letter-spacing:.06em;
  text-transform:uppercase;cursor:pointer;outline:none;
}
select.status.ACCEPTED{border-color:var(--ok);color:var(--ok)}
select.status.WAITLIST{border-color:var(--warn);color:var(--warn)}
select.status.REJECTED{border-color:var(--bad);color:var(--bad)}
select.status.PROBABLY{border-color:var(--ok);color:var(--ok);border-style:dashed}
.del{
  appearance:none;background:transparent;border:2px solid rgba(192,80,77,.35);color:var(--bad);
  border-radius:999px;padding:9px 14px;font-family:var(--fsans);font-weight:700;font-size:12px;
  letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:.15s;
}
.del:hover{border-color:var(--bad);background:rgba(192,80,77,.06)}
.del:disabled{opacity:.4;cursor:not-allowed}
.prt{
  appearance:none;background:transparent;border:2px solid rgba(228,114,106,.35);color:var(--coral);
  border-radius:999px;padding:9px 14px;font-family:var(--fsans);font-weight:700;font-size:12px;
  letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:.15s;
}
.prt:hover{border-color:var(--coral);background:rgba(228,114,106,.06)}
.contact{display:flex;gap:8px 16px;flex-wrap:wrap;margin:12px 0 4px}
.contact a{color:var(--coral);font-weight:600;font-size:14px;text-decoration:none;border-bottom:1.5px solid rgba(228,114,106,.3);word-break:break-all}
.contact a:hover{border-color:var(--coral)}
.qa{margin-top:14px}
.qa .l{font-weight:800;font-size:11px;letter-spacing:.22em;color:var(--rose);text-transform:uppercase;margin-bottom:6px}
.qa .v{font-weight:500;font-size:15px;line-height:1.55;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.qa .v.dim{color:var(--rose);font-style:italic}
.qa .v a{color:var(--coral)}
.imgs{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.imgs a{display:block;width:96px;height:96px;border-radius:12px;overflow:hidden;border:2px solid var(--line)}
.imgs a.idimg{border-color:var(--rose)}
.imgs img{width:100%;height:100%;object-fit:cover;display:block;background:#fff}
.imgs a.doc{display:flex;align-items:center;justify-content:center;text-decoration:none;background:#fff;color:var(--rose);font-weight:800;font-size:13px;letter-spacing:.06em}
.ts{margin-top:14px;font-weight:600;font-size:12px;letter-spacing:.04em;color:var(--rose)}
#empty{padding:70px 20px;text-align:center;font-family:var(--fdisp);font-weight:700;font-size:20px;color:var(--rose)}
#msg{font-weight:600;font-size:14px;color:var(--rose);margin:8px 0 16px;min-height:18px}
</style>
</head>
<body>
<div class="wrap">

  <section id="lock" class="panel">
    <div class="logo">Admin</div>
    <div class="sub">Reid&rsquo;s Parties - Applications</div>
    <input class="inp" id="pass" type="password" placeholder="Passcode" autocomplete="current-password">
    <div class="err" id="lockErr"></div>
    <button class="btn" id="unlock">Unlock</button>
  </section>

  <section id="dash">
    <div class="topRow">
      <div>
        <div class="logo">Reid&rsquo;s&nbsp;Parties</div>
        <div class="sub">Applications</div>
      </div>
      <div class="topBtns">
        <button class="btn ghost" id="guestsBtn">Guest list</button>
        <button class="btn ghost" id="refresh">Refresh</button>
        <button class="btn ghost" id="lockBtn">Lock</button>
      </div>
    </div>
    <div class="statRow"><div class="statNum" id="total">0</div><div class="statLbl">Total applicants</div></div>
    <div class="tabs" id="tabs"></div>
    <input class="inp" id="search" type="search" placeholder="Search name, socials, answers…">
    <div id="msg"></div>
    <div id="cards"></div>
    <div id="empty" class="panel" style="display:none">No applications yet</div>
    <div class="statRow" style="margin-top:38px"><div class="statNum" id="wtotal">0</div><div class="statLbl">Signed waivers</div></div>
    <div id="waivers"></div>
  </section>

</div>

<script>
(function(){
'use strict';

var CFG = window.PARTY_CONFIG || {};
var LOCAL = (location.hostname === 'localhost' || location.hostname === '127.0.0.1');
var ENDPOINT = CFG.ENDPOINT || (LOCAL ? '/exec' : '');
var STATUSES = ['PENDING','ACCEPTED','PROBABLY YES','WAITLIST','REJECTED'];
var TABS = ['ALL'].concat(STATUSES);

var token = '';
try{ token = localStorage.getItem('rp_admin_token') || ''; }catch(e){}
var rows = [];
var wrows = [];
var activeTab = 'ALL';
var query = '';

var $ = function(id){ return document.getElementById(id); };

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function pad(n){ return String(n).padStart(3,'0'); }
function fmtRef(s){ return String(s).replace(/https?:\/\//g,'').replace(/\/+$/,''); }

function setView(unlocked){
  $('lock').classList.toggle('on', !unlocked);
  $('dash').classList.toggle('on', unlocked);
}

/* ---------- data ---------- */
function load(){
  if (!ENDPOINT){
    $('msg').textContent = 'ENDPOINT not set in config.js - see SETUP.md.';
    return;
  }
  $('msg').textContent = 'Loading…';
  fetch(ENDPOINT, {method:'POST', body: JSON.stringify({action:'list', token: token})})
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (!res.ok){
        token = '';
        try{ localStorage.removeItem('rp_admin_token'); }catch(e){}
        setView(false);
        $('lockErr').textContent = 'Wrong passcode.';
        return;
      }
      rows = (res.rows || []).slice().sort(function(a,b){ return (b.n||0)-(a.n||0); });
      $('msg').textContent = '';
      render();
      loadWaivers();
    })
    .catch(function(){ $('msg').textContent = 'Network error - pull to refresh / tap REFRESH.'; });
}

function loadWaivers(){
  fetch(ENDPOINT, {method:'POST', body: JSON.stringify({action:'waivers', token: token})})
    .then(function(r){ return r.json(); })
    .then(function(res){ if (res.ok){ wrows = res.rows || []; renderWaivers(); } })
    .catch(function(){});
}

/* ---------- render ---------- */
function counts(){
  var c = {ALL: rows.length};
  STATUSES.forEach(function(s){ c[s] = 0; });
  rows.forEach(function(r){ c[(r.status||'PENDING')] = (c[(r.status||'PENDING')]||0) + 1; });
  return c;
}

function renderTabs(){
  var c = counts();
  var t = $('tabs');
  t.innerHTML = '';
  TABS.forEach(function(name){
    var b = document.createElement('button');
    b.className = 'tab' + (activeTab === name ? ' on' : '');
    b.textContent = name + ' ' + (c[name]||0);
    b.addEventListener('click', function(){ activeTab = name; render(); });
    t.appendChild(b);
  });
}

function thumbUrl(u){
  var m = String(u).match(/[-\w]{25,}/);
  if (String(u).indexOf('drive.google.com') >= 0 && m){
    return 'https://drive.google.com/thumbnail?id=' + m[0] + '&sz=w480';
  }
  return u;
}

/* existence verdict the worker stamped at submit time; silent when unknown */
function socBadge(v){
  if (v === 'ok') return ' <span style="color:var(--ok);font-weight:700;font-size:12px">account found</span>';
  if (v === 'not_found') return ' <span style="color:var(--bad);font-weight:700;font-size:12px">account not found</span>';
  return '';
}

function linkifySocials(s){
  return String(s||'').split(/[\s,]+/).filter(Boolean).map(function(tk){
    if (/\./.test(tk)){
      var href = /^https?:\/\//i.test(tk) ? tk : 'https://' + tk;
      return '<a href="' + esc(href) + '" target="_blank" rel="noopener">' + esc(tk) + '</a>';
    }
    return '<span style="color:var(--rose);font-weight:600;font-size:14px">' + esc(tk) + '</span>';
  }).join(' ');
}

function imgBlock(urls, idmode){
  if (!urls || !urls.length) return '';
  return '<div class="imgs">' + urls.map(function(u){
    return '<a class="' + (idmode?'idimg':'') + '" href="' + esc(u) + '" target="_blank" rel="noopener"><img loading="lazy" onerror="this.parentNode.className+=\' doc\';this.parentNode.textContent=\'PDF\'" src="' + esc(thumbUrl(u)) + '" alt=""></a>';
  }).join('') + '</div>';
}

function fmtTs(ts){
  var d = new Date(ts);
  if (isNaN(d)) return esc(String(ts||''));
  return d.toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
}

/* canonical source name so typing "tiktok" / "meta" / "qr" in search filters by origin */
function srcName(r){
  var v = String(r.ref||'').toLowerCase();
  if (/tiktok|src=tt\b/.test(v)) return 'tiktok';
  if (/instagram|facebook|fb\.|src=ig\b|src=fb\b|src=meta\b/.test(v)) return 'meta instagram facebook';
  if (/src=qr\b/.test(v)) return 'qr flier';
  return '';
}

function matches(r){
  if (activeTab !== 'ALL' && (r.status||'PENDING') !== activeTab) return false;
  if (!query) return true;
  var hay = [r.name, r.email, r.phone, r.socials, r.why, r.working, r.contrarian, r.hobby, r.want, r.age, r.ref, srcName(r)].join(' ').toLowerCase();
  return hay.indexOf(query) >= 0;
}

function qa(label, val, dim){
  return '<div class="qa"><div class="l">' + label + '</div><div class="v' + (dim?' dim':'') + '">' + (val || '<span class="dim" style="color:var(--rose)">-</span>') + '</div></div>';
}

function render(){
  renderTabs();
  $('total').textContent = rows.length;
  var list = rows.filter(matches);
  var c = $('cards');
  c.innerHTML = '';
  $('empty').style.display = list.length ? 'none' : 'block';
  list.forEach(function(r){
    var card = document.createElement('div');
    card.className = 'card';
    var st = (r.status || 'PENDING').toUpperCase();
    card.innerHTML =
      '<div class="cardHead">' +
        '<span class="cnum">№ ' + pad(r.n||0) + '</span>' +
        '<span class="cname">' + esc(r.name) + '</span>' +
        '<span class="cage">' + esc(r.age) + '</span>' +
        (r.sign_key ? '<span style="color:var(--' + (r.signed?'ok':'bad') + ');font-weight:800;font-size:12px;letter-spacing:.04em">' + (r.signed ? 'SIGNED WAIVER' : 'HAS NOT SIGNED WAIVER') + '</span>' : '') +
        '<span class="grow"></span>' +
        '<select class="status sexSel" title="Guest list group">' +
          '<option value=""' + (!r.sex?' selected':'') + '>&mdash;</option>' +
          '<option value="M"' + (r.sex==='M'?' selected':'') + '>Man</option>' +
          '<option value="F"' + (r.sex==='F'?' selected':'') + '>Woman</option>' +
        '</select>' +
        '<select class="status ' + esc(st) + '">' +
          STATUSES.map(function(s){ return '<option value="' + s + '"' + (s===st?' selected':'') + '>' + s + '</option>'; }).join('') +
        '</select>' +
        '<button class="del" type="button">Delete</button>' +
      '</div>' +
      '<div class="contact">' +
        '<a href="mailto:' + esc(r.email) + '">' + esc(r.email) + '</a>' +
        '<a href="tel:' + esc(String(r.phone).replace(/[^\d+]/g,'')) + '">' + esc(r.phone) + '</a>' +
      '</div>' +
      qa('Socials', linkifySocials(r.socials) + socBadge(r.soc_check)) +
      qa('Why they want in', esc(r.why)) +
      qa('Working on', esc(r.working)) +
      qa('Contrarian take', esc(r.contrarian)) +
      (r.hobby ? qa('Childhood hobby', esc(r.hobby)) : '') +
      (r.want ? qa('What they want', esc(r.want)) : '') +
      (r.ref ? qa('Found us via', esc(fmtRef(r.ref))) : '') +
      (r.sign_key ? qa('Waiver',
        '<a href="waiver.html?k=' + esc(r.sign_key) + '" target="_blank" rel="noopener">signing link</a>' +
        (st === 'ACCEPTED'
          ? ' <button class="prt sendTxt" type="button">' + (r.notified === 1 ? 'Resend approval text' : 'Send approval text') + '</button>' +
            ' <button class="prt copyTxt" type="button">Copy text</button>'
          : '') +
        (r.notified === 1 ? ' <span style="color:var(--ok);font-weight:700;font-size:12px">texted</span>' : '')) : '') +
      (r.images && r.images.length ? qa('Images', imgBlock(r.images, false)) : '') +
      (r.id_images && r.id_images.length ? qa('ID (legacy uploads)', imgBlock(r.id_images, true)) : '') +
      '<div class="ts">' + fmtTs(r.ts) + '</div>';

    var sel = card.querySelector('select.status:not(.sexSel)');
    sel.addEventListener('change', function(){
      var ns = sel.value;
      var old = r.status || 'PENDING';
      r.status = ns;
      sel.className = 'status ' + ns;
      renderTabs();
      fetch(ENDPOINT, {method:'POST', body: JSON.stringify({action:'setStatus', token: token, n: r.n, status: ns})})
        .then(function(x){ return x.json(); })
        .then(function(res){
          if (!res.ok){
            r.status = old; sel.value = old; sel.className = 'status ' + old; renderTabs();
            $('msg').textContent = 'Status update failed: ' + (res.error||'unknown');
            return;
          }
          /* approval mints the signing link server-side - reload to show it */
          if (ns === 'ACCEPTED') load();
        })
        .catch(function(){
          r.status = old; sel.value = old; sel.className = 'status ' + old; renderTabs();
          $('msg').textContent = 'Network error - status not saved.';
        });
    });

    var sx = card.querySelector('select.sexSel');
    sx.addEventListener('change', function(){
      r.sex = sx.value;
      fetch(ENDPOINT, {method:'POST', body: JSON.stringify({action:'setSex', token: token, n: r.n, sex: sx.value})})
        .then(function(x){ return x.json(); })
        .then(function(res){ if (!res.ok) $('msg').textContent = 'Group not saved: ' + (res.error||'unknown'); })
        .catch(function(){ $('msg').textContent = 'Network error - group not saved.'; });
    });

    /* Send approval text: 10s countdown, tap again to cancel */
    var sendBtn = card.querySelector('button.sendTxt');
    if (sendBtn){
      var sendLabel = function(){ return r.notified === 1 ? 'Resend approval text' : 'Send approval text'; };
      var timer = null;
      sendBtn.addEventListener('click', function(){
        if (timer){ clearInterval(timer); timer = null; sendBtn.textContent = sendLabel(); return; }
        var left = 10;
        sendBtn.textContent = 'Sending in ' + left + ' - tap to cancel';
        timer = setInterval(function(){
          left--;
          if (left > 0){ sendBtn.textContent = 'Sending in ' + left + ' - tap to cancel'; return; }
          clearInterval(timer); timer = null;
          sendBtn.disabled = true; sendBtn.textContent = 'Sending…';
          fetch(ENDPOINT, {method:'POST', body: JSON.stringify({action:'notify', token: token, n: r.n})})
            .then(function(x){ return x.json(); })
            .then(function(res){
              sendBtn.disabled = false;
              if (res.ok){ r.notified = 1; sendBtn.textContent = sendLabel(); $('msg').textContent = 'Approval text sent to ' + (r.name||'') + '.'; }
              else { sendBtn.textContent = sendLabel(); $('msg').textContent = 'Text not sent: ' + (res.error||'unknown'); }
            })
            .catch(function(){ sendBtn.disabled = false; sendBtn.textContent = sendLabel(); $('msg').textContent = 'Network error - text not sent.'; });
        }, 1000);
      });
    }

    /* Copy text: the exact message (with their link) for manual sending (Burner) */
    var copyBtn = card.querySelector('button.copyTxt');
    if (copyBtn){
      copyBtn.addEventListener('click', function(){
        fetch(ENDPOINT, {method:'POST', body: JSON.stringify({action:'notify', token: token, n: r.n, preview: true})})
          .then(function(x){ return x.json(); })
          .then(function(res){
            if (!res.ok) throw new Error(res.error || 'preview failed');
            return navigator.clipboard.writeText(res.msg).then(function(){
              copyBtn.textContent = 'Copied';
              setTimeout(function(){ copyBtn.textContent = 'Copy text'; }, 1500);
            });
          })
          .catch(function(e){ $('msg').textContent = 'Could not copy: ' + ((e && e.message) || 'clipboard blocked'); });
      });
    }

    var del = card.querySelector('button.del');
    del.addEventListener('click', function(){
      if (!window.confirm('Delete application № ' + pad(r.n||0) + ' - ' + (r.name||'') + '?\nThis permanently removes the row and cannot be undone.')) return;
      del.disabled = true;
      $('msg').textContent = '';
      fetch(ENDPOINT, {method:'POST', body: JSON.stringify({action:'delete', token: token, n: r.n})})
        .then(function(x){ return x.json(); })
        .then(function(res){
          if (res.ok){
            rows = rows.filter(function(x){ return x.n !== r.n; });
            render();
          } else {
            del.disabled = false;
            $('msg').textContent = 'Delete failed: ' + (res.error||'unknown');
          }
        })
        .catch(function(){ del.disabled = false; $('msg').textContent = 'Network error - not deleted.'; });
    });
    c.appendChild(card);
  });
}

/* Print = the real signed contract: fetch waiver.html (single source of the
   agreement text), fill name/signature/date into its paper layout, print. */
var waiverDoc = '';
function printWaiver(r){
  var go = function(html){
    var f = document.createElement('iframe');
    f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
    f.onload = function(){
      var d = f.contentDocument;
      var inp = d.getElementById('wname');
      if (inp) inp.value = r.name || '';
      /* the print stylesheet already hides the e-sign UI and shows .sig-print */
      var cells = d.querySelectorAll('.sig-print .line');
      if (cells.length === 3){
        var bottom = 'display:flex;align-items:flex-end;font-size:12pt';
        cells[0].style.cssText = bottom;
        cells[0].textContent = r.name || '';
        cells[1].style.cssText = bottom;
        var img = d.createElement('img');
        img.src = r.sig;
        img.style.cssText = 'height:42pt;max-width:100%';
        cells[1].appendChild(img);
        cells[2].style.cssText = bottom;
        var dt = new Date(r.ts);
        cells[2].textContent = isNaN(dt) ? String(r.ts||'') : dt.toLocaleDateString([], {year:'numeric', month:'short', day:'numeric'});
      }
      setTimeout(function(){
        try { f.contentWindow.focus(); f.contentWindow.print(); } catch(e){}
        setTimeout(function(){ f.remove(); }, 60000);
      }, 300); /* let the signature image and fonts settle */
    };
    f.srcdoc = html.replace(/<script[\s\S]*?<\/script>/gi, '');
    document.body.appendChild(f);
  };
  if (waiverDoc) return go(waiverDoc);
  fetch('waiver.html')
    .then(function(x){ if (!x.ok) throw 0; return x.text(); })
    .then(function(h){ waiverDoc = h; go(h); })
    .catch(function(){ $('msg').textContent = 'Could not load waiver.html to print.'; });
}

function renderWaivers(){
  $('wtotal').textContent = wrows.length;
  var c = $('waivers');
  c.innerHTML = '';
  wrows.forEach(function(r){
    var card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<div class="cardHead">' +
        '<span class="cnum">№ ' + pad(r.n||0) + '</span>' +
        '<span class="cname">' + esc(r.name) + '</span>' +
        '<span class="grow"></span>' +
        '<button class="prt" type="button">Print</button>' +
        '<button class="del" type="button">Delete</button>' +
      '</div>' +
      '<img src="' + esc(r.sig) + '" alt="signature" style="display:block;background:#fff;border-radius:12px;max-width:100%;max-height:96px;margin-top:10px">' +
      '<div class="ts">' + fmtTs(r.ts) + (r.app_n ? ' &middot; application № ' + pad(r.app_n) : '') + (r.ip ? ' &middot; ' + esc(r.ip) : '') + '</div>';
    card.querySelector('button.prt').addEventListener('click', function(){ printWaiver(r); });
    card.querySelector('button.del').addEventListener('click', function(){
      if (!window.confirm('Delete signed waiver № ' + pad(r.n||0) + ' - ' + (r.name||'') + '?\nThis permanently removes it and cannot be undone.')) return;
      fetch(ENDPOINT, {method:'POST', body: JSON.stringify({action:'delwaiver', token: token, n: r.n})})
        .then(function(x){ return x.json(); })
        .then(function(res){
          if (res.ok){ wrows = wrows.filter(function(x){ return x.n !== r.n; }); renderWaivers(); }
          else $('msg').textContent = 'Waiver delete failed: ' + (res.error||'unknown');
        })
        .catch(function(){ $('msg').textContent = 'Network error - waiver not deleted.'; });
    });
    c.appendChild(card);
  });
}

/* ---------- events ---------- */
$('unlock').addEventListener('click', function(){
  var p = $('pass').value.trim();
  if (!p){ $('lockErr').textContent = 'Enter the passcode.'; return; }
  token = p;
  try{ localStorage.setItem('rp_admin_token', token); }catch(e){}
  $('lockErr').textContent = '';
  setView(true);
  load();
});
$('pass').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('unlock').click(); });
$('refresh').addEventListener('click', load);
$('guestsBtn').addEventListener('click', function(){ window.open('guests.html', '_blank'); });
$('lockBtn').addEventListener('click', function(){
  token = '';
  try{ localStorage.removeItem('rp_admin_token'); }catch(e){}
  rows = [];
  setView(false);
});
$('search').addEventListener('input', function(){
  query = $('search').value.trim().toLowerCase();
  render();
});

/* ---------- init ---------- */
if (token){ setView(true); load(); }
else setView(false);

})();
</script>
