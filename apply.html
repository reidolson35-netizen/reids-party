<script>
/* first-touch source: remember how they originally found us (src= tag or external referrer) */
try{
  var _q=new URLSearchParams(location.search).get('src');
  var _r=document.referrer||'';
  if(_r.indexOf(location.origin)===0)_r='';
  var _v=(_q?'src='+_q+(_r?' · ':''):'')+_r;
  if(_v&&!localStorage.getItem('rp_src'))localStorage.setItem('rp_src',_v);
  /* TikTok click id (ad-click attribution; sent server-side on submit only) */
  var _tt=new URLSearchParams(location.search).get('ttclid');
  if(_tt&&!localStorage.getItem('rp_ttclid'))localStorage.setItem('rp_ttclid',_tt);
  /* visit counter: one pixel per browser session; server stores day x page x source only */
  if(!sessionStorage.getItem('rp_v')){
    sessionStorage.setItem('rp_v','1');
    var _u=new URLSearchParams(location.search).get('utm_source');
    new Image().src='https://reidsparty-api.reid-f55.workers.dev/hit?p='+encodeURIComponent(location.pathname)+'&r='+encodeURIComponent(_q||_u||_r);
  }
}catch(e){}

<style>
:root{
  --bg:#fbf4c7;
  --rose:#e79b93;
  --rose-bold:#e4726a;
  --coral:#f0736b;
  --btn:#f7cbc6;
  --ink:#6b4f47;
  --line:#efd9a6;
  --bad:#c0504d;
  --fdisp:"quiche-display","Fraunces",Georgia,serif;
  --fsans:"quiche-sans","Figtree",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:clip}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--fsans);
  min-height:100dvh;
}
::selection{background:var(--rose-bold);color:var(--bg)}

/* ---------- buttons ---------- */
.btn{
  appearance:none;
  background:var(--btn);border:none;color:var(--rose-bold);
  border-radius:999px;padding:15px 30px;
  font-family:var(--fsans);font-weight:700;font-size:17px;line-height:1;
  cursor:pointer;box-shadow:0 6px 16px rgba(228,114,106,.16);
  transition:box-shadow .15s ease, transform .15s ease, opacity .15s ease;
  touch-action:manipulation;
}
.btn:hover{box-shadow:0 10px 22px rgba(228,114,106,.26);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.4;box-shadow:none;cursor:not-allowed;transform:none}
/* padding 2px tighter: the border made Back 4px taller than Next */
.btn.ghost{background:transparent;border:2px solid var(--line);padding:13px 28px;color:var(--rose-bold);box-shadow:none}
.btn.ghost:hover{border-color:var(--coral)}

/* ---------- progress ---------- */
#progress{position:fixed;top:0;top:env(safe-area-inset-top);left:0;right:0;height:4px;background:rgba(240,115,107,.18);z-index:50}
#progressFill{height:100%;width:0%;background:var(--coral);transition:width .35s ease}

/* ---------- 8-point flower: separate petal strokes appear step by step; a
   ring joins the petal tips on the final screen. No CSS filters - the glow is
   a soft under-stroke per petal, which keeps phones smooth. ---------- */
#spiro{position:fixed;inset:0;width:100vw;height:100vh;height:100svh;z-index:0;pointer-events:none;overflow:visible}
#spiro path{fill:none;stroke:var(--coral);stroke-linecap:round;stroke-linejoin:round;transition:stroke-dashoffset .6s ease}
#spiro path.glow{stroke:rgba(240,115,107,.10);stroke-width:7}
#spiro path.core{stroke-width:2;opacity:.38}
/* ---------- steps ---------- */
.step{display:none}
.step.on{
  position:relative;z-index:1;
  display:flex;flex-direction:column;justify-content:center;
  /* svh, not dvh: dvh recentered the step whenever the mobile URL bar moved */
  min-height:100vh;min-height:100svh;max-width:640px;margin:0 auto;
  padding:40px 22px calc(40px + env(safe-area-inset-bottom));
  animation:fadeUp .4s ease both;
}
/* phones: the flower becomes a small crest above the content (fullscreen
   centered art was covering the thank-you text on small screens). Must stay
   BELOW the .step.on rule - its padding shorthand stomps this padding-top */
@media (max-width:640px){
  .step.on{padding-top:calc(158px + env(safe-area-inset-top))}
  #spiro path.glow{stroke-width:3.5}
  #spiro path.core{stroke-width:1.4}
}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ---------- intro ---------- */
.step.intro{align-items:center;text-align:center}
.introCopy{font-weight:600;font-size:19px;line-height:1.6;color:var(--rose);max-width:520px;margin:0 0 34px}

/* ---------- question ---------- */
.qnum{font-weight:800;font-size:13px;letter-spacing:.3em;color:var(--coral)}
.qopt{color:var(--rose);letter-spacing:.16em;margin-left:10px;font-weight:700;font-size:11px}
.qlabel{font-family:var(--fdisp);font-weight:700;font-size:clamp(25px,5.6vw,34px);line-height:1.16;color:var(--rose-bold);margin:14px 0 8px}
.qhelp{font-weight:500;font-size:15px;line-height:1.5;color:var(--rose);margin:0 0 22px}
.inp{
  width:100%;background:#fffdf4;border:2px solid var(--line);border-radius:14px;
  color:var(--ink);font-family:var(--fsans);font-weight:500;font-size:19px;
  padding:16px;outline:none;transition:border-color .15s, box-shadow .15s;
}
.inp:focus{border-color:var(--coral);box-shadow:0 0 0 4px rgba(240,115,107,.16)}
.inp::placeholder{color:#c7b89a}
textarea.inp{resize:vertical;min-height:150px;line-height:1.5}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;min-height:20px}
.err{font-weight:600;font-size:14px;color:var(--bad);min-height:18px}
.cnt{font-weight:700;font-size:13px;letter-spacing:.05em;color:var(--rose)}
.cnt.ok{color:var(--rose-bold)}
.nav{display:flex;gap:12px;margin-top:28px;align-items:center}
.nav .spacer{flex:1}

/* ---------- social handle picker ---------- */
.srow{display:flex;gap:10px;align-items:stretch;position:relative}
.pbtn{
  flex:0 0 auto;white-space:nowrap;background:#fffdf4;
  border:2px solid var(--line);border-radius:14px;color:var(--rose-bold);
  font-family:var(--fsans);font-weight:700;font-size:15px;padding:0 16px;
  cursor:pointer;transition:border-color .15s;
}
.pbtn::after{content:"\25BE";margin-left:8px;opacity:.65;font-size:12px}
.pbtn:hover{border-color:var(--coral)}
.sinp{flex:1 1 auto;min-width:0}
.pmenu{
  display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:20;
  min-width:180px;background:#fffdf4;border:2px solid var(--line);
  border-radius:14px;box-shadow:0 12px 28px rgba(228,114,106,.18);overflow:hidden;
}
.pmenu.open{display:block}
.popt{
  display:block;width:100%;text-align:left;background:none;border:none;
  color:var(--ink);font-family:var(--fsans);font-weight:600;font-size:16px;
  padding:12px 16px;cursor:pointer;
}
.popt:hover{background:rgba(240,115,107,.10);color:var(--rose-bold)}

/* ---------- optional uploader ---------- */
.urow{display:flex;align-items:center;gap:14px;margin-top:6px}
.btn.small{padding:10px 20px;font-size:14px}
.unote{font-weight:500;font-size:13px;line-height:1.4;color:var(--rose)}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.thumb.doc{display:flex;align-items:center;justify-content:center;background:#fffdf4;color:var(--rose-bold);font-weight:800;font-size:13px;letter-spacing:.08em}
.thumb{position:relative;width:86px;height:86px;border-radius:12px;overflow:hidden;border:2px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{
  position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:8px;
  border:1px solid var(--line);background:rgba(255,253,244,.94);color:var(--rose-bold);
  font-weight:800;font-size:13px;line-height:1;cursor:pointer;padding:0;
}

/* ---------- success ---------- */
.bigYellow{font-family:var(--fdisp);font-weight:700;font-size:clamp(36px,8vw,60px);line-height:1.05;color:var(--rose-bold);margin:0 0 26px;text-decoration:underline;text-decoration-thickness:.05em;text-underline-offset:.1em}
.outro{font-weight:600;font-size:17px;line-height:1.6;color:var(--rose);max-width:480px}

/* ---------- overlay ---------- */
#busy{
  display:none;position:fixed;inset:0;z-index:100;
  background:rgba(251,244,199,.92);
  align-items:center;justify-content:center;flex-direction:column;gap:18px;
}
#busy.on{display:flex}
#busyText{font-weight:800;font-size:16px;letter-spacing:.28em;color:var(--rose-bold);text-transform:uppercase;animation:blink 1.1s ease-in-out infinite alternate}
@keyframes blink{from{opacity:.45}to{opacity:1}}
.hp{position:absolute;left:-6000px;top:-6000px;height:1px;width:1px;opacity:0}
</style>
</head>
<body>
<div id="progress"><div id="progressFill"></div></div>
<svg id="spiro" aria-hidden="true"></svg>
<input class="hp" id="hp" name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
<main id="app"></main>
<div id="busy"><div id="busyText">Sending</div></div>

<script>
(function(){
'use strict';

var CFG = window.PARTY_CONFIG || {};
var LOCAL = (location.hostname === 'localhost' || location.hostname === '127.0.0.1');
var ENDPOINT = CFG.ENDPOINT || (LOCAL ? '/exec' : '');

/* One question per screen; contact (phone or email) comes last. */
var QUESTIONS = [
  {id:'name',      type:'text',     label:'What is your name?', req:true, ph:'First and last'},
  {id:'socials',   type:'social',   label:'What’s your handle?', helper:'Public, if possible. Any platform is fine, just something that shows who you are.', req:true, ph:'yourhandle'},
  {id:'age',       type:'age',      label:'What is your age?', helper:'Must be between 20-26.', req:true, ph:'20-26'},
  {id:'why',       type:'textarea', label:'Provide 1 (or a few) reasons why you want to come to our party', req:true},
  {id:'working',   type:'textarea', label:'What are you working on?', helper:'Go into as much detail as you want.', req:true, files:true, max:5},
  {id:'contrarian',type:'textarea', label:'What is something you think is true that most people would disagree with you about?', helper:'No wrong answers, seriously.', req:true},
  {id:'want',      type:'textarea', label:'What do you want?', helper:'Answer this however you’d like.', req:true},
  {id:'contact',   type:'contact',  label:'How should we contact you?', helper:'Phone number or email, whichever one you won’t miss.', req:true, ph:'Phone or email'}
];
var TOTAL = QUESTIONS.length;

var answers = {};
var fileStore = {images:[]};
var step = 0;             /* 0 = intro, 1..TOTAL = questions, TOTAL+1 = success */
var submitting = false;

/* ---------- draft persistence (text answers only) ----------
   sessionStorage on purpose: a draft only survives within its own tab, so a
   later applicant on the same phone can never see a previous applicant's
   answers. It still covers the real loss case (reload / accidental nav). */
function saveDraft(){
  try{ sessionStorage.setItem('rp_draft', JSON.stringify(answers)); }catch(e){}
}
function loadDraft(){
  try{ localStorage.removeItem('rp_draft'); }catch(e){}  /* purge pre-2026-07-13 device-wide drafts */
  try{
    var d = JSON.parse(sessionStorage.getItem('rp_draft') || 'null');
    if (d && typeof d === 'object') answers = d;
  }catch(e){}
}
function clearDraft(){ try{ sessionStorage.removeItem('rp_draft'); }catch(e){} }

/* ---------- helpers ---------- */
function el(tag, cls, html){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html !== undefined) n.innerHTML = html;
  return n;
}
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function validate(q){
  var v = String(answers[q.id] == null ? '' : answers[q.id]).trim();
  switch(q.type){
    case 'contact':
      if (!v) return {ok:false, msg:''};
      if (v.indexOf('@') >= 0)
        return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v) ? {ok:true} : {ok:false, msg:'That email doesn’t look right.'};
      return ((v.match(/\d/g)||[]).length >= 7) ? {ok:true} : {ok:false, msg:'That phone number looks short.'};
    case 'age':
      if (!v) return {ok:false, msg:''};
      var n = parseInt(v,10);
      if (isNaN(n) || n < 1 || n > 120) return {ok:false, msg:'Enter your real age.'};
      if (n < 20 || n > 26) return {ok:false, msg:'Must be between 20-26 to apply.'};
      return {ok:true};
    case 'social':
      if (socState.err) return {ok:false, msg:socState.err};
      return v.length > 0 ? {ok:true} : {ok:false, msg:''};
    default:
      return v.length > 0 ? {ok:true} : {ok:false, msg:''};
  }
}

/* ---------- image compression ---------- */
function loadImage(url){
  return new Promise(function(res, rej){
    var img = new Image();
    img.onload = function(){ res(img); };
    img.onerror = function(){ rej(new Error('unreadable image')); };
    img.src = url;
  });
}
function compressFile(f, maxDim, quality){
  var url = URL.createObjectURL(f);
  return loadImage(url).then(function(img){
    var w = img.naturalWidth, h = img.naturalHeight;
    var scale = Math.min(1, maxDim / Math.max(w, h));
    w = Math.max(1, Math.round(w*scale)); h = Math.max(1, Math.round(h*scale));
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    var dataUrl = c.toDataURL('image/jpeg', quality);
    URL.revokeObjectURL(url);
    return {
      name: (f.name || 'image').replace(/\.[^.]+$/,'') + '.jpg',
      type: 'image/jpeg',
      data: dataUrl.split(',')[1],
      thumb: dataUrl
    };
  }).catch(function(e){ URL.revokeObjectURL(url); throw e; });
}

/* ---------- build DOM ---------- */
var app = document.getElementById('app');
var fill = document.getElementById('progressFill');
var sections = [];

function buildIntro(){
  var s = el('section','step intro');
  s.appendChild(el('p','introCopy','This should take 5&ndash;10 minutes. We want to know what kind of person you are. Our goal is to keep the room quality very high, without charging a fee. Please answer honestly.'));
  var b = el('button','btn','Continue');
  b.addEventListener('click', function(){ show(1); });
  s.appendChild(b);
  return s;
}

function buildQuestion(q, idx){
  var s = el('section','step');
  var head = el('div','qnum', pad2(idx) + (q.req ? '' : '<span class="qopt">Optional</span>'));
  s.appendChild(head);
  s.appendChild(el('h2','qlabel', esc(q.label)));
  if (q.helper) s.appendChild(el('p','qhelp', esc(q.helper)));

  var inputWrap = el('div');
  var input = null, errEl = el('div','err');

  if (q.type === 'textarea'){
    input = el('textarea','inp');
    input.rows = 7;
  } else if (q.type === 'social'){
    input = buildSocial(q, idx, errEl, s);
  } else {
    input = el('input','inp');
    input.type = (q.type === 'age') ? 'number' : 'text';
    if (q.type === 'age'){ input.min = 1; input.max = 120; input.inputMode = 'numeric'; }
    if (q.type === 'contact'){ input.autocapitalize = 'off'; }
    input.autocomplete = (q.id === 'name') ? 'name' : 'off';
  }
  if (q.ph && input.tagName !== 'DIV') input.placeholder = q.ph;
  inputWrap.appendChild(input);

  var meta = el('div','meta');
  meta.appendChild(errEl);
  inputWrap.appendChild(meta);
  if (q.files) inputWrap.appendChild(buildUploader(q, errEl));
  s.appendChild(inputWrap);

  var nav = el('div','nav');
  var back = el('button','btn ghost','Back');
  back.addEventListener('click', function(){ show(step - 1); });
  var spacer = el('div','spacer');
  var next = el('button','btn', idx === TOTAL ? 'Submit application' : 'Next');
  next.addEventListener('click', function(){ advance(q, idx, errEl); });
  nav.appendChild(back); nav.appendChild(spacer); nav.appendChild(next);
  s.appendChild(nav);

  /* wire input events */
  if (q.type !== 'files' && q.type !== 'social'){
    input.addEventListener('input', function(){
      answers[q.id] = input.value;
      saveDraft();
      refreshState(q, s);
    });
    input.addEventListener('keydown', function(ev){
      if (ev.key === 'Enter' && !ev.shiftKey){
        ev.preventDefault();
        advance(q, idx, errEl);
      }
    });
  }

  s._q = q;
  s._input = input;
  s._next = next;
  s._err = errEl;
  return s;
}

function pad2(n){ return String(n).padStart(2,'0'); }

/* compact optional uploader under a question: small Upload button + note.
   Images get canvas-compressed; PDFs ride along raw (worker stores base64
   up to 2.5M chars, so cap PDFs at ~1.8 MB before encoding). */
function buildUploader(q, errEl){
  var wrap = el('div');
  var row = el('div','urow');
  var btn = el('button','btn ghost small','Upload'); btn.type = 'button';
  var note = el('span','unote','If you want to attach any photos or documents, do so here.');
  var fi = document.createElement('input');
  fi.type = 'file';
  fi.accept = 'image/*,application/pdf';
  fi.multiple = q.max > 1;
  fi.style.display = 'none';
  var thumbs = el('div','thumbs');

  btn.addEventListener('click', function(){ fi.click(); });
  fi.addEventListener('change', function(){
    var list = Array.prototype.slice.call(fi.files || []);
    fi.value = '';
    errEl.textContent = '';
    var room = q.max - fileStore.images.length;
    if (list.length > room){
      list = list.slice(0, room);
      errEl.textContent = 'Max ' + q.max + ' files.';
    }
    Promise.all(list.map(function(f){
      if (f.type === 'application/pdf'){
        if (f.size > 1800000){
          errEl.textContent = 'PDFs need to be under 1.8 MB.';
          return Promise.resolve(null);
        }
        return new Promise(function(res){
          var r = new FileReader();
          r.onload = function(){ res({name: f.name || 'document.pdf', type:'application/pdf', data: String(r.result).split(',')[1], thumb:''}); };
          r.onerror = function(){ res(null); };
          r.readAsDataURL(f);
        });
      }
      return compressFile(f, 1600, 0.82).catch(function(){ return null; });
    })).then(function(items){
      items.forEach(function(it){ if (it) fileStore.images.push(it); });
      renderThumbs();
    });
  });

  function renderThumbs(){
    thumbs.innerHTML = '';
    fileStore.images.forEach(function(it, i){
      var t = el('div','thumb' + (it.thumb ? '' : ' doc'));
      if (it.thumb){
        var img = document.createElement('img');
        img.src = it.thumb;
        img.alt = '';
        t.appendChild(img);
      } else {
        t.appendChild(el('span', null, 'PDF'));
      }
      var x = el('button', null, '×');
      x.addEventListener('click', function(){
        fileStore.images.splice(i,1);
        renderThumbs();
      });
      t.appendChild(x);
      thumbs.appendChild(t);
    });
    btn.textContent = fileStore.images.length >= q.max ? (fileStore.images.length + ' / ' + q.max) : 'Upload';
    btn.disabled = fileStore.images.length >= q.max;
  }

  row.appendChild(btn); row.appendChild(note);
  wrap.appendChild(row);
  wrap.appendChild(fi);
  wrap.appendChild(thumbs);
  return wrap;
}

/* ---------- social handle: pick a platform, then just type the handle.
   answers.socials becomes a real profile URL so it's clickable on review.
   re = the platform's own username charset and length, nothing stricter,
   so no real account can ever fail the format gate. */
var SOCIALS = [
  {name:'Instagram', base:'https://instagram.com/', hosts:['instagram.com'],         re:/^[a-z0-9._]{1,30}$/i},
  {name:'TikTok',    base:'https://tiktok.com/@',   hosts:['tiktok.com'],            re:/^[a-z0-9._]{1,24}$/i},
  {name:'Facebook',  base:'https://facebook.com/',  hosts:['facebook.com','fb.com'], re:/^[a-z0-9.\-]{1,60}$/i},
  {name:'x.com',     base:'https://x.com/',         hosts:['x.com','twitter.com'],   re:/^[a-z0-9_]{1,20}$/i},
  {name:'YouTube',   base:'https://youtube.com/@',  hosts:['youtube.com'],           re:/^[a-z0-9._\-]{1,30}$/i}
];

/* Turn whatever they typed into a profile URL. Pasted links from a listed
   platform auto-pick it; weird-but-real profile links (share links,
   /channel/..., profile.php?id=...) are kept verbatim, still clickable. */
function parseSocial(raw, chosen){
  var v = String(raw||'').trim().replace(/^@+/,'');
  if (!v) return {url:'', err:''};
  if (/\s/.test(v)) return {url:'', err:'Handles don’t have spaces. Just the @name from your profile.'};

  var lower = v.toLowerCase(), hit = null, at = -1;
  SOCIALS.forEach(function(p){
    p.hosts.forEach(function(h){
      if (hit) return;
      var i = lower.indexOf(h + '/');
      if (i >= 0 && (i === 0 || lower.charAt(i-1) === '.' || lower.charAt(i-1) === '/')){
        hit = p; at = i + h.length + 1;
      }
    });
  });

  if (hit){
    var rest = v.slice(at).replace(/^@+/,'');
    var clean = rest.replace(/\/+$/,'');
    if (!clean) return {plat:hit, url:'', err:'Add your handle after the link, or type just the handle.'};
    if (!/[\/?#]/.test(clean) && hit.re.test(clean)) return {plat:hit, url: hit.base + clean};
    return {plat:hit, url:(/^https?:\/\//i.test(v) ? v : 'https://' + v)};
  }
  if (/^https?:\/\//i.test(v) || /^www\./i.test(v) || /^[a-z0-9-]+(\.[a-z0-9-]+)+\//i.test(v)){
    return {url:'', err:'That link isn’t from a platform in the list. Pick one and give just the handle.'};
  }
  if (!chosen) return {url:'', err:'Pick a platform from the list.'};
  if (!chosen.re.test(v)) return {url:'', err:'That doesn’t look like a real ' + chosen.name + ' handle.'};
  return {url: chosen.base + v};
}
var socState = {err:''};

function buildSocial(q, idx, errEl, section){
  var wrap = el('div');
  var row = el('div','srow');
  var pick = el('button','pbtn','Select platform'); pick.type = 'button';
  var menu = el('div','pmenu');
  var input = el('input','inp sinp');
  input.type = 'text';
  input.autocapitalize = 'off'; input.autocomplete = 'off'; input.spellcheck = false;
  if (q.ph) input.placeholder = q.ph;
  var chosen = null;

  function commit(){
    var parsed = parseSocial(input.value, chosen);
    if (parsed.plat && parsed.plat !== chosen){
      chosen = parsed.plat;
      pick.textContent = chosen.name; pick.classList.add('sel');
    }
    socState.err = parsed.err || '';
    answers[q.id] = parsed.url || '';
    saveDraft();
    refreshState(q, section);
  }

  SOCIALS.forEach(function(p){
    var opt = el('button','popt', esc(p.name)); opt.type = 'button';
    opt.addEventListener('click', function(){
      chosen = p;
      pick.textContent = p.name; pick.classList.add('sel');
      menu.classList.remove('open');
      commit(); input.focus();
    });
    menu.appendChild(opt);
  });

  pick.addEventListener('click', function(){ menu.classList.toggle('open'); });
  document.addEventListener('click', function(ev){ if (!row.contains(ev.target)) menu.classList.remove('open'); });

  input.addEventListener('input', commit);
  input.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter' && !ev.shiftKey){ ev.preventDefault(); advance(q, idx, errEl); }
  });

  row.appendChild(pick); row.appendChild(input); row.appendChild(menu);
  wrap.appendChild(row);
  return wrap;
}

function buildSuccess(){
  var s = el('section','step intro');
  s.appendChild(el('h1','bigYellow','Thank you.'));
  s.appendChild(el('p','outro','If you’re a fit, you’ll hear from us within the next seven days.'));

  var friends = el('p','outro','We’d love it if your friends applied too.');
  friends.style.marginTop = '30px';
  s.appendChild(friends);

  var btn = el('button','btn','Share');
  btn.style.marginTop = '16px';
  var note = el('div','cnt');
  note.style.marginTop = '12px';
  note.style.minHeight = '18px';
  btn.addEventListener('click', function(){
    var url = location.origin + '/';
    var data = {
      title: 'Reid’s Parties',
      text: 'Apply to Reid’s Parties, application-based parties for genuinely interesting people in Austin.',
      url: url
    };
    if (navigator.share){
      navigator.share(data).catch(function(){});
    } else if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){ note.textContent = 'Link copied!'; })
        .catch(function(){ note.textContent = url; });
    } else {
      note.textContent = url;
    }
  });
  s.appendChild(btn);
  s.appendChild(note);
  return s;
}

/* ---------- state / nav ---------- */
function refreshState(q, section){
  var v = validate(q);
  var empty = !String(answers[q.id]||'').trim();
  if (!q.req && empty){
    section._next.textContent = 'Skip';
    section._next.disabled = false;
  } else {
    section._next.textContent = (section._idx === TOTAL) ? 'Submit application' : 'Next';
    section._next.disabled = !v.ok;
  }
  section._err.textContent = v.ok ? '' : (v.msg || '');
}

function advance(q, idx, errEl){
  var v = validate(q);
  var empty = !String(answers[q.id]||'').trim();
  if (q.req || !empty){
    if (!v.ok){ errEl.textContent = v.msg || 'This one’s required.'; return; }
  }
  if (q.type === 'social' && !empty){ checkSocialThen(idx, errEl); return; }
  if (idx === TOTAL) submit();
  else show(idx + 1);
}

/* Soft existence check: ask the backend to look the profile up. Only a
   definitive "account doesn't exist" pauses them, exactly once; any doubt
   (bot walls, timeouts, a second Next on the same value) lets them through,
   so a valid account can never be blocked. */
var socChecked = {url:'', busy:false};
function checkSocialThen(idx, errEl){
  var url = String(answers.socials||'');
  var s = sections[idx];
  if (socChecked.busy) return;
  if (!ENDPOINT || socChecked.url === url){ show(idx + 1); return; }
  socChecked.busy = true;
  s._next.disabled = true;
  s._next.textContent = 'Checking…';
  var done = false;
  function finish(result){
    if (done) return;
    done = true;
    socChecked = {url:url, busy:false};
    s._next.disabled = false;
    s._next.textContent = 'Next';
    if (result === 'not_found'){
      errEl.textContent = 'We couldn’t find that account. Double-check the handle, or hit Next again if you’re sure it’s right.';
      return;
    }
    show(idx + 1);
  }
  setTimeout(function(){ finish('unknown'); }, 5000);
  fetch(ENDPOINT, {method:'POST', body: JSON.stringify({action:'check', url:url})})
    .then(function(r){ return r.json(); })
    .then(function(res){ finish(res && res.result === 'not_found' ? 'not_found' : 'ok'); })
    .catch(function(){ finish('unknown'); });
}

/* 8-point flower, one outer layer. Each petal is split into little sub-arcs
   revealed round-robin across the petals - scattered disconnected segments
   fill in more and more each step, becoming whole petals by the end; a ring
   joins the petal tips on the thank-you screen. */
var spiroSvg = document.getElementById('spiro');
/* runs everywhere - Reduce Motion phones were getting a static page */
var reduceMotion = false;
var petals = [];
var PETALS = 8, SEGS = 6;
var SP_TOTAL = PETALS * SEGS;

function petalSegD(cx, cy, rIn, rOut, rot, f0, f1){
  var d = '';
  for (var i = 0; i <= 8; i++){
    var t = f0 + (f1 - f0) * i / 8;
    var phi = -Math.PI / 8 + (Math.PI / 4) * t;
    var rr = rIn + (rOut - rIn) * Math.cos(4 * phi);
    var a = rot + phi;
    d += (i ? 'L' : 'M') + (cx + rr * Math.cos(a)).toFixed(1) + ',' + (cy + rr * Math.sin(a)).toFixed(1);
  }
  return d;
}

var spW = 0, spH = 0;
function buildSpiro(){
  if (!spiroSvg) return;
  /* measure the svg itself so the viewBox always matches what's rendered -
     window.innerHeight drifts from the fixed 100svh box as the URL bar moves,
     and a mismatched viewBox rescales (shakes) the art */
  var box = spiroSvg.getBoundingClientRect();
  var vw = Math.round(box.width), vh = Math.round(box.height);
  spW = vw; spH = vh;
  spiroSvg.setAttribute('viewBox', '0 0 ' + vw + ' ' + vh);
  spiroSvg.innerHTML = '';
  petals = [];
  var NS = 'http://www.w3.org/2000/svg';
  /* phones: tiny crest at the top, matching the media query's padding */
  var mini = vw <= 640;
  var cx = vw / 2, cy = mini ? 96 : vh / 2;
  var R = mini ? 46 : Math.min(vw, vh) * 0.47;

  function addStroke(d, idx, isRing){
    ['glow', 'core'].forEach(function(cls){
      var p = document.createElementNS(NS, 'path');
      p.setAttribute('d', d);
      p.setAttribute('class', cls);
      spiroSvg.appendChild(p);
      var L = p.getTotalLength();
      p.style.strokeDasharray = L;
      p.style.strokeDashoffset = L;
      petals.push({el: p, len: L, idx: idx, ring: !!isRing});
    });
  }

  /* reveal order s*PETALS+p: each new batch lands on a different petal */
  for (var p = 0; p < PETALS; p++){
    for (var s = 0; s < SEGS; s++){
      addStroke(petalSegD(cx, cy, R * 0.55, R, p * Math.PI / 4, s / SEGS, (s + 1) / SEGS), s * PETALS + p, false);
    }
  }
  /* the ring that connects the petal tips - final step only */
  addStroke('M ' + (cx + R) + ',' + cy +
    ' A ' + R + ' ' + R + ' 0 1 1 ' + (cx - R) + ' ' + cy +
    ' A ' + R + ' ' + R + ' 0 1 1 ' + (cx + R) + ' ' + cy, SP_TOTAL, true);

  applySpiro(true);
}

function applySpiro(instant){
  if (!petals.length) return;
  var f = reduceMotion ? 1 : (step + 1) / (TOTAL + 2);   /* intro starts it, success completes it */
  var show = Math.round(f * SP_TOTAL);
  var done = step >= TOTAL + 1;
  petals.forEach(function(c){
    var on = c.ring ? (done || reduceMotion) : c.idx < show;
    if (instant) c.el.style.transition = 'none';
    else c.el.style.transitionDelay = on ? ((c.idx % 5) * 90) + 'ms' : '0ms';
    c.el.style.strokeDashoffset = on ? 0 : c.len;
  });
  if (instant){
    void spiroSvg.getBoundingClientRect();
    petals.forEach(function(c){ c.el.style.transition = ''; });
  }
}
var spT = null;
window.addEventListener('resize', function(){ clearTimeout(spT); spT = setTimeout(function(){
  /* URL-bar resizes don't change the 100svh box - skip the rebuild flash */
  var b = spiroSvg.getBoundingClientRect();
  if (Math.round(b.width) !== spW || Math.round(b.height) !== spH) buildSpiro();
}, 180); }, {passive:true});

function show(i){
  step = Math.max(0, Math.min(TOTAL + 1, i));
  sections.forEach(function(s, j){ s.classList.toggle('on', j === step); });
  fill.style.width = Math.round(100 * step / (TOTAL + 1)) + '%';
  applySpiro();
  var s = sections[step];
  if (s && s._q){
    refreshState(s._q, s);
    if (s._input && s._input.tagName !== 'DIV'){
      if (s._input.value !== (answers[s._q.id]||'')) s._input.value = answers[s._q.id]||'';
      setTimeout(function(){ try{ s._input.focus({preventScroll:false}); }catch(e){} }, 60);
    }
  }
  window.scrollTo(0,0);
}

/* ---------- submit ---------- */
function submit(){
  if (submitting) return;
  if (!ENDPOINT){
    alert('Applications aren’t open yet. The submission endpoint isn’t configured. (Owner: see SETUP.md)');
    return;
  }
  submitting = true;
  var busy = document.getElementById('busy');
  busy.classList.add('on');

  var payload = {
    hp: document.getElementById('hp').value || '',
    ua: navigator.userAgent,
    ref: (function(){ try{ return (localStorage.getItem('rp_src')||document.referrer||'').slice(0,300); }catch(e){ return ''; } })(),
    ttclid: (function(){ try{ return (localStorage.getItem('rp_ttclid')||'').slice(0,200); }catch(e){ return ''; } })(),
    ts: new Date().toISOString(),
    answers: (function(){
      /* one contact question feeds the existing email/phone columns */
      var contact = String(answers.contact||'').trim();
      var isEmail = contact.indexOf('@') >= 0;
      return {
        email: isEmail ? contact : '',
        name: String(answers.name||'').trim(),
        socials: String(answers.socials||'').trim(),
        age: String(answers.age||'').trim(),
        why: String(answers.why||'').trim(),
        working: String(answers.working||'').trim(),
        contrarian: String(answers.contrarian||'').trim(),
        want: String(answers.want||'').trim(),
        phone: isEmail ? '' : contact
      };
    })(),
    images: fileStore.images.map(function(f){ return {name:f.name, type:f.type, data:f.data}; })
  };

  fetch(ENDPOINT, {method:'POST', body: JSON.stringify(payload)})
    .then(function(r){ return r.json(); })
    .then(function(res){
      busy.classList.remove('on');
      submitting = false;
      if (res && res.ok){
        clearDraft();
        show(TOTAL + 1);
      } else {
        var last = sections[TOTAL];
        last._err.textContent = (res && res.error) ? res.error : 'Something broke. Try again.';
      }
    })
    .catch(function(){
      busy.classList.remove('on');
      submitting = false;
      sections[TOTAL]._err.textContent = 'Network error. Your answers are safe, hit submit again.';
    });
}

/* ---------- init ---------- */
loadDraft();
sections.push(buildIntro());
QUESTIONS.forEach(function(q, i){
  var s = buildQuestion(q, i + 1);
  s._idx = i + 1;
  sections.push(s);
});
sections.push(buildSuccess());
sections.forEach(function(s){ app.appendChild(s); });
var m = (location.hash || '').match(/^#q(\d+)$/);
show(m ? Math.min(TOTAL, parseInt(m[1], 10)) : 0);
buildSpiro();

})();
</script>
