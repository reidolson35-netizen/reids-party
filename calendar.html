<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add to your calendar - Reid's Parties</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fbf4c7'/%3E%3Ctext x='32' y='46' font-family='Georgia,serif' font-size='40' font-weight='700' fill='%23e4726a' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E" type="image/svg+xml">
<link rel="stylesheet" href="https://use.typekit.net/yvb0zhe.css">
<!-- EVENT TIME lives in TWO places: the Google link below AND party.ics.
     Placeholder is Sat Sep 5 2026, 7:00-11:00 PM local. Change BOTH if you move it. -->
<style>
:root{
  --bg:#fbf4c7;--rose:#e79b93;--rose-head:#efa79f;--rose-bold:#e4726a;--pill:#f7cbc6;
  --fdisp:"quiche-display","Fraunces",Georgia,serif;
  --fsans:"quiche-sans","Figtree",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--rose);font-family:var(--fsans);
  font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
main{max-width:520px;margin:0 auto;padding:64px 24px;text-align:center}
h1{font-family:var(--fdisp);font-weight:700;font-size:clamp(30px,6vw,42px);
  line-height:1.08;color:var(--rose-bold);margin:0 0 10px}
.when{font-weight:700;color:var(--rose-bold);font-size:19px;margin:0 0 6px}
.sub{font-weight:600;font-size:15px;color:var(--rose-head);margin:0 0 34px}
.btns{display:flex;flex-direction:column;gap:14px;max-width:340px;margin:0 auto}
.cbtn{appearance:none;display:block;text-decoration:none;cursor:pointer;
  font-family:var(--fsans);font-weight:700;font-size:18px;border-radius:999px;padding:16px 24px}
.cbtn.g{color:#7a4b46;background:var(--pill);border:2px solid var(--pill)}
.cbtn.a{color:var(--rose-bold);background:#fff;border:2px solid var(--pill)}
.foot{font-size:14px;color:var(--rose-head);font-weight:600;margin:30px 0 0}
</style>
</head>
<body>
<main>
  <h1>See you there.</h1>
  <p class="when">Saturday, September 5th, 2026</p>
  <p class="sub">Add it so it&rsquo;s locked in. I&rsquo;ll text the address the week before.</p>
  <div class="btns">
    <a class="cbtn g" target="_blank" rel="noopener"
       href="https://calendar.google.com/calendar/render?action=TEMPLATE&amp;text=Reid%27s%20Party&amp;dates=20260905T190000/20260905T230000&amp;details=You%27re%20on%20the%20list.%20I%27ll%20text%20the%20address%20the%20week%20before.">Add to Google Calendar</a>
    <a class="cbtn a" href="party.ics" download="Reids-Party.ics">Add to Apple / Outlook</a>
  </div>
  <p class="foot">Reid&rsquo;s Parties</p>
</main>
</body>
</html>
