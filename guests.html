<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Guest List - Reid's Parties</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fbf4c7'/%3E%3Ctext x='32' y='46' font-family='Georgia,serif' font-size='40' font-weight='700' fill='%23e4726a' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E" type="image/svg+xml">
<link rel="stylesheet" href="https://use.typekit.net/yvb0zhe.css">
<style>
:root{
  --bg:#fbf4c7;
  --rose:#e79b93;
  --rose-head:#efa79f;
  --rose-bold:#e4726a;
  --pill:#f7cbc6;
  --fdisp:"quiche-display","Fraunces",Georgia,serif;
  --fsans:"quiche-sans","Figtree",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--rose);
  font-family:var(--fsans);font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
main{max-width:640px;margin:0 auto;padding:52px 24px 72px}
h1{
  font-family:var(--fdisp);font-weight:700;
  font-size:clamp(34px,6vw,46px);line-height:1.05;
  color:var(--rose-bold);margin:0 0 6px;
}
.sub{font-weight:600;font-size:15px;color:var(--rose-bold);margin:0 0 4px}
.note{font-weight:600;font-size:14px;color:var(--rose-head);margin:0 0 40px}
h2{
  font-family:var(--fdisp);font-weight:700;
  font-size:clamp(24px,4vw,30px);color:var(--rose-head);
  margin:38px 0 14px;
}
.guest{background:#fff;border-radius:16px;padding:16px 18px;margin:0 0 14px;box-shadow:0 2px 12px rgba(228,114,106,.10)}
.ghead{display:flex;gap:14px;align-items:center}
.gpic{flex:0 0 auto;width:72px;height:72px;border-radius:50%;object-fit:cover;
  background:var(--pill);border:2px solid rgba(228,114,106,.25)}
img.gpic{cursor:zoom-in}
.gpic.ph{display:flex;align-items:center;justify-content:center;font-family:var(--fdisp);
  font-weight:700;font-size:28px;color:var(--rose-bold)}
.gname{flex:1 1 auto;min-width:0;font-weight:700;font-size:20px;color:var(--rose-bold);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbio{margin:12px 0 0;font-size:15px;line-height:1.5;color:var(--rose);white-space:pre-wrap}
.zoom{position:fixed;inset:0;background:rgba(40,20,20,.82);display:none;
  align-items:center;justify-content:center;z-index:50;cursor:zoom-out;padding:24px}
.zoom.on{display:flex}
.zoom img{max-width:88vw;max-height:88vh;border-radius:16px;object-fit:contain;
  box-shadow:0 10px 40px rgba(0,0,0,.4)}
.cedit{flex:0 0 auto;font-size:14px;font-weight:700;color:var(--rose-head);cursor:pointer;
  text-decoration:underline;text-underline-offset:3px;padding:4px 2px}
/* confetti while the list loads */
.pop{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden;transition:opacity .6s}
.pop.bye{opacity:0}
.pop i{position:absolute;top:-18px;width:10px;height:16px;border-radius:3px;opacity:.9;
  animation:fall linear infinite}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
/* the old view lifts away, then the list cascades in card by card */
#view{transition:opacity .33s ease,transform .33s ease}
#view.out{opacity:0;transform:translateY(-16px) scale(.985)}
.arr{animation:arrive .55s cubic-bezier(.2,.85,.3,1) both}
@keyframes arrive{from{opacity:0;transform:translateY(22px) scale(.97)}}
#msg{font-weight:600}

/* the about-me gate */
.gate{margin:0}
.gate label{display:block;font-weight:700;color:var(--rose-bold);margin:0 0 8px;font-size:16px}
textarea.bio{
  width:100%;min-height:132px;padding:14px 16px;box-sizing:border-box;
  background:#fff;border:2px solid var(--pill);border-radius:14px;
  color:#7a4b46;font-family:var(--fsans);font-size:16px;line-height:1.5;resize:vertical;outline:none;
}
textarea.bio:focus{border-color:var(--rose-bold)}
input.dname{width:100%;padding:13px 16px;box-sizing:border-box;background:#fff;
  border:2px solid var(--pill);border-radius:12px;color:#7a4b46;
  font-family:var(--fsans);font-size:16px;outline:none;margin:0}
input.dname:focus{border-color:var(--rose-bold)}
.photoRow{display:flex;align-items:center;gap:14px;margin:18px 0 6px}
.photoBtn{
  appearance:none;cursor:pointer;font-family:var(--fsans);font-weight:700;font-size:14px;
  color:var(--rose-bold);background:transparent;border:2px dashed rgba(228,114,106,.5);
  border-radius:999px;padding:11px 20px;
}
.photoPrev{width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid var(--pill)}
.photoDrop{background:transparent;border:none;color:var(--rose-head);font-weight:700;
  cursor:pointer;font-size:20px;line-height:1;padding:4px}
.btn{
  appearance:none;cursor:pointer;font-family:var(--fsans);font-weight:700;font-size:18px;
  color:#7a4b46;background:var(--pill);border:none;border-radius:999px;
  padding:15px 34px;margin-top:22px;
}
.btn:disabled{opacity:.55;cursor:default}
.hint{font-size:14px;color:var(--rose-head);font-weight:600;margin:6px 0 0}
</style>
</head>
<body>
<main>
  <h1>The Guest List</h1>
  <p class="sub">September 5th, 2026</p>
  <p class="note">(visible only to approved guests)</p>
  <div id="msg">Loading&hellip;</div>
  <div id="view"></div>
</main>

<script src="config.js"></script>
<script>
(function(){
'use strict';
var EP = (window.PARTY_CONFIG && window.PARTY_CONFIG.ENDPOINT) || '/exec';
var $ = function(id){ return document.getElementById(id); };

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function links(s){
  return String(s||'').split(/[\s,]+/).filter(Boolean).map(function(tk){
    if (/\./.test(tk)){
      var href = /^https?:\/\//i.test(tk) ? tk : 'https://' + tk;
      return '<a href="' + esc(href) + '" target="_blank" rel="noopener">' + esc(tk.replace(/^https?:\/\//i,'')) + '</a>';
    }
    return '<span>' + esc(tk) + '</span>';
  }).join(' ');
}
function initial(name){ var t = String(name||'').trim(); return t ? t.charAt(0).toUpperCase() : '?'; }

/* downscale a chosen photo to a small JPEG so it fits the worker's cap */
function readPhoto(file){
  return new Promise(function(resolve){
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      var w = img.naturalWidth, h = img.naturalHeight;
      var scale = Math.min(1, 1200 / Math.max(w, h));
      w = Math.max(1, Math.round(w*scale)); h = Math.max(1, Math.round(h*scale));
      var c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      var dataUrl = c.toDataURL('image/jpeg', 0.82);
      URL.revokeObjectURL(url);
      resolve({ type:'image/jpeg', data: dataUrl.split(',')[1], thumb: dataUrl });
    };
    img.onerror = function(){ URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}

/* tap a photo to blow it up, tap again to close (like an IG profile pic) */
var zoomEl = null;
function zoomPic(src){
  if (!zoomEl){
    zoomEl = document.createElement('div');
    zoomEl.className = 'zoom';
    zoomEl.innerHTML = '<img alt="">';
    zoomEl.addEventListener('click', function(){ zoomEl.classList.remove('on'); });
    document.body.appendChild(zoomEl);
  }
  zoomEl.firstChild.src = src;
  zoomEl.classList.add('on');
}
document.addEventListener('click', function(e){
  var t = e.target;
  if (t && t.classList && t.classList.contains('gpic') && t.tagName === 'IMG') zoomPic(t.src);
});

var K = '';
try { K = new URLSearchParams(location.search).get('k') || ''; }catch(e){}
var token = '';
try { token = localStorage.getItem('rp_admin_token') || ''; }catch(e){}

function denied(){
  $('view').innerHTML = '';
  $('msg').textContent = 'This page is invitation-only. Approved guests get a private link by text.';
}

var POP_COLORS = ['#e4726a','#efa79f','#f7cbc6','#ffffff','#e79b93'];
function popStart(){
  var d0 = $('pop'); if (d0) d0.remove();
  var d = document.createElement('div'); d.id = 'pop'; d.className = 'pop';
  for (var i = 0; i < 28; i++){
    var s = document.createElement('i');
    s.style.left = (Math.random()*100) + '%';
    s.style.background = POP_COLORS[i % POP_COLORS.length];
    s.style.animationDuration = (1.4 + Math.random()*1.2) + 's';
    s.style.animationDelay = (Math.random()*0.7) + 's';
    d.appendChild(s);
  }
  document.body.appendChild(d);
}
function popStop(){
  var d = $('pop'); if (!d) return;
  d.classList.add('bye');
  setTimeout(function(){ d.remove(); }, 650);
}

function loadList(){
  $('msg').textContent = '';
  popStart();
  var t0 = Date.now();
  fetch(EP, {method:'POST', body: JSON.stringify({action:'guestlist', k: K, token: token})})
    .then(function(r){ return r.json(); })
    .then(function(res){
      /* let the confetti land, lift the old view away, then cascade the list in */
      setTimeout(function(){
        $('view').classList.add('out');
        setTimeout(function(){
          popStop();
          $('view').classList.remove('out');
          if (!res.ok) return denied();
          if (res.needsBio) return renderGate(res.name || '');
          renderList(res);
        }, 340);
      }, Math.max(0, 700 - (Date.now() - t0)));
    })
    .catch(function(){ popStop(); $('msg').textContent = 'Network error - try again.'; });
}

function renderList(res){
  var rows = res.rows || [];
  if (!rows.length){
    $('view').innerHTML = '';
    $('msg').textContent = 'The list goes live a few days before the party.';
    return;
  }
  $('msg').textContent = '';
  var groups = [ {sex:'M', title:'Gentlemen'}, {sex:'F', title:'Ladies'} ];
  if (res.admin) groups.push({sex:'', title:'Not sorted yet (only you see this)'});
  var html = '';
  groups.forEach(function(g){
    var members = rows.filter(function(r){ return r.sex === g.sex; });
    if (!members.length) return;
    html += '<h2>' + g.title + '</h2>';
    members.forEach(function(m){
      var pic = m.photo
        ? '<img class="gpic" src="' + esc(m.photo) + '" alt="">'
        : '<div class="gpic ph">' + esc(initial(m.name)) + '</div>';
      html += '<div class="guest">' +
                '<div class="ghead">' + pic + '<span class="gname">' + esc(m.name) + '</span>' +
                  (m.mine && res.me ? '<span class="cedit">edit</span>' : '') + '</div>' +
                (m.bio ? '<p class="gbio">' + esc(m.bio) + '</p>' : '') +
              '</div>';
    });
  });
  $('view').innerHTML = html;
  var kids = $('view').children;
  for (var i = 0; i < kids.length; i++){
    kids[i].style.animationDelay = Math.min(i*75, 1100) + 'ms';
    kids[i].classList.add('arr');
  }
  var ce = $('view').querySelector('.cedit');
  if (ce && res.me) ce.addEventListener('click', function(){ renderGate(res.me.name, res.me.bio, res.me.photo); });
}

function renderGate(name, curBio, curPhoto){
  $('msg').textContent = '';
  var hi = name ? ('Hey ' + esc(String(name).trim().split(/\s+/)[0]) + ',') : 'Almost there,';
  $('view').innerHTML =
    '<div class="gate">' +
      '<p class="sub" style="font-size:16.5px;margin-bottom:18px">' + hi + ' we\'d love it if you\'d tell everyone a little about yourself, and you\'re welcome to attach a selfie if you\'d like.' +
        '<br><br>This will only be visible to people coming to the party, nobody else. We do this to make it easier to go up and talk to people.</p>' +
      '<textarea class="bio" id="bio" placeholder="Who are you? Anything you want the room to know.">' + esc(curBio || '') + '</textarea>' +
      '<label for="dname" style="margin-top:20px">Your name on the list</label>' +
      '<input class="dname" id="dname" type="text" maxlength="120" value="' + esc(name) + '">' +
      '<div class="photoRow" id="photoRow">' +
        '<button class="photoBtn" type="button" id="photoBtn">Add a photo of yourself</button>' +
        '<span class="hint">Optional</span>' +
      '</div>' +
      '<input type="file" id="photoInput" accept="image/*" style="display:none">' +
      '<div><button class="btn" id="go" type="button">See the guest list</button></div>' +
      '<p class="hint" id="gerr"></p>' +
    '</div>';

  var photo = null;
  var input = $('photoInput');
  function pickPhoto(){ input.click(); }
  $('photoBtn').addEventListener('click', pickPhoto);
  input.addEventListener('change', function(){
    var f = (input.files || [])[0]; input.value = '';
    if (!f) return;
    $('gerr').textContent = '';
    readPhoto(f).then(function(p){
      if (!p){ $('gerr').textContent = 'Could not read that image, try another.'; return; }
      photo = p;
      $('photoRow').innerHTML =
        '<img class="photoPrev" src="' + p.thumb + '" alt="">' +
        '<button class="photoDrop" type="button" title="Remove">&times;</button>' +
        '<span class="hint">Looks good</span>';
      $('photoRow').querySelector('.photoDrop').addEventListener('click', function(){
        photo = null;
        $('photoRow').innerHTML =
          '<button class="photoBtn" type="button" id="photoBtn2">Add a photo of yourself</button>' +
          '<span class="hint">Optional</span>';
        $('photoRow').querySelector('#photoBtn2').addEventListener('click', pickPhoto);
      });
    });
  });

  var go = $('go');
  go.addEventListener('click', function(){
    var bio = ($('bio').value || '').trim();
    if (!bio){ $('gerr').textContent = 'Write a little about yourself first.'; $('bio').focus(); return; }
    go.disabled = true; go.textContent = 'Saving…';
    var body = {action:'guestbio', k: K, bio: bio, name: ($('dname').value || '').trim()};
    if (photo) body.photo = {type: photo.type, data: photo.data};
    fetch(EP, {method:'POST', body: JSON.stringify(body)})
      .then(function(r){ return r.json(); })
      .then(function(res){
        if (!res.ok){ go.disabled = false; go.textContent = 'See the guest list'; $('gerr').textContent = res.error || 'Something went wrong, try again.'; return; }
        loadList();
      })
      .catch(function(){ go.disabled = false; go.textContent = 'See the guest list'; $('gerr').textContent = 'Network error, try again.'; });
  });

  if (curPhoto){
    $('photoRow').innerHTML =
      '<img class="photoPrev" src="' + esc(curPhoto) + '" alt="">' +
      '<button class="photoBtn" type="button" id="photoChg">Change photo</button>' +
      '<span class="hint">Optional</span>';
    $('photoChg').addEventListener('click', pickPhoto);
  }
}

if (!/^[0-9a-f]{32}$/.test(K) && !token){ denied(); }
else { loadList(); }
})();
</script>
</body>
</html>
